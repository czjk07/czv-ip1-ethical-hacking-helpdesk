{% extends "base.html" %}
{% block title %}Welcome - HelpDesk{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8 text-center py-5">
    <h1 class="display-5 fw-bold mb-3">HelpDesk MVP</h1>
    <p class="lead text-muted mb-4">
      Submit support tickets, track their status, upload attachments and chat with the support team &mdash; all in one place.
    </p>
    <div class="d-flex justify-content-center gap-2">
      <a href="{{ url_for('auth.register') }}" class="btn btn-primary btn-lg">Create an account</a>
      <a href="{{ url_for('auth.login') }}" class="btn btn-outline-secondary btn-lg">Log in</a>
    </div>
  </div>
</div>
{% endblock %}
